<header class="it-header" [class.it-header--scrolled]="isScrolled() || isMenuOpen()">
  <a class="it-header__logo" href="#home" aria-label="Ionita Tech, back to top" (click)="navigateTo($event, 'home')">
    Ionita<span>Tech.</span>
  </a>

  <nav class="it-header__nav" aria-label="Main">
    <ul class="it-header__nav-list">
      @for (item of navItems(); track item.target) {
        <li>
          <a [href]="'#' + item.target" (click)="navigateTo($event, item.target)">{{ item.label }}</a>
        </li>
      }
    </ul>
  </nav>

  <div class="it-header__actions">
    <a class="it-header__cta" href="#contact" (click)="navigateTo($event, 'contact')">Start Project</a>

    <button
      #menuToggle
      class="it-header__menu-toggle"
      [class.it-header__menu-toggle--open]="isMenuOpen()"
      type="button"
      aria-controls="it-mobile-menu"
      [attr.aria-expanded]="isMenuOpen()"
      [attr.aria-label]="isMenuOpen() ? 'Close menu' : 'Open menu'"
      (click)="toggleMenu()"
    >
      <span class="it-header__menu-icon" aria-hidden="true"></span>
    </button>
  </div>
</header>

@if (isMenuOpen()) {
  <div class="it-mobile-menu__backdrop" aria-hidden="true" (click)="closeMenu()"></div>

  <nav id="it-mobile-menu" class="it-mobile-menu" aria-label="Mobile">
    <ul class="it-mobile-menu__list">
      @for (item of navItems(); track item.target; let first = $first) {
        <li>
          @if (first) {
            <a #firstMenuLink class="it-mobile-menu__item" [href]="'#' + item.target" (click)="navigateTo($event, item.target)">
              {{ item.label }}
            </a>
          } @else {
            <a class="it-mobile-menu__item" [href]="'#' + item.target" (click)="navigateTo($event, item.target)">
              {{ item.label }}
            </a>
          }
        </li>
      }
      <li>
        <a class="it-mobile-menu__item" href="#contact" (click)="navigateTo($event, 'contact')">Contact</a>
      </li>
    </ul>

    <a class="it-mobile-menu__cta" href="#contact" (click)="navigateTo($event, 'contact')">Start Project</a>
  </nav>
}
