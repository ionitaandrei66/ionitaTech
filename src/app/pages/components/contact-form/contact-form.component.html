<form class="it-contact-form" [formGroup]="form" [attr.aria-labelledby]="labelledBy()" (ngSubmit)="submit()" novalidate>
  <div class="it-contact-form__trap" aria-hidden="true">
    <label for="contact-website">Leave this field empty</label>
    <input id="contact-website" formControlName="website" tabindex="-1" autocomplete="off" />
  </div>

  <div class="it-field">
    <label class="it-visually-hidden" for="contact-name">Your name (required)</label>
    <div class="it-field__control" [class.it-field__control--error]="isInvalid('name')">
      <input
        id="contact-name"
        formControlName="name"
        placeholder="Your Name"
        autocomplete="name"
        required
        [maxlength]="limits.nameMaxLength"
        [attr.aria-invalid]="isInvalid('name')"
        [attr.aria-describedby]="isInvalid('name') ? 'contact-name-error' : null"
      />
    </div>
    @if (isInvalid('name')) {
      <p id="contact-name-error" class="it-field__error">Name is required.</p>
    }
  </div>

  <div class="it-field">
    <label class="it-visually-hidden" for="contact-email">Your email (required)</label>
    <div class="it-field__control" [class.it-field__control--error]="isInvalid('email')">
      <input
        id="contact-email"
        type="email"
        formControlName="email"
        placeholder="Your Email"
        autocomplete="email"
        required
        [maxlength]="limits.emailMaxLength"
        [attr.aria-invalid]="isInvalid('email')"
        [attr.aria-describedby]="isInvalid('email') ? 'contact-email-error' : null"
      />
    </div>
    @if (isInvalid('email')) {
      <p id="contact-email-error" class="it-field__error">Please enter a valid email address.</p>
    }
  </div>

  <div class="it-field">
    <label class="it-visually-hidden" for="contact-message">Your message (required)</label>
    <div class="it-field__control it-field__control--textarea" [class.it-field__control--error]="isInvalid('message')">
      <textarea
        id="contact-message"
        formControlName="message"
        placeholder="Type your message here"
        required
        [maxlength]="limits.messageMaxLength"
        [attr.aria-invalid]="isInvalid('message')"
        [attr.aria-describedby]="isInvalid('message') ? 'contact-message-error' : null"
      ></textarea>
    </div>
    @if (isInvalid('message')) {
      <p id="contact-message-error" class="it-field__error">Message is required.</p>
    }
  </div>

  <div class="it-field">
    <label class="it-consent-check" [class.it-consent-check--error]="isInvalid('privacyAccepted')">
      <input
        type="checkbox"
        formControlName="privacyAccepted"
        required
        [attr.aria-invalid]="isInvalid('privacyAccepted')"
      />
      <span>
        I agree that my name, email and message are sent through
        <a [href]="emailJsPrivacyUrl" target="_blank" rel="noopener noreferrer">EmailJS (opens in a new tab)</a>, a
        third-party service, so that Ionita Tech can answer this request, as described in the
        <a routerLink="/privacy" target="_blank">Privacy Policy (opens in a new tab)</a>.
      </span>
    </label>
  </div>

  <button type="submit" class="it-contact-form__submit" [disabled]="isSending()" [attr.aria-busy]="isSending()">
    {{ isSending() ? 'Sending…' : 'Send message' }}
  </button>
</form>
