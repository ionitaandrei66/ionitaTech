<div class="it-toast-stack" aria-live="polite">
  @for (toast of toastService.toasts(); track toast.id) {
    <div
      class="it-toast"
      [class.it-toast--success]="toast.type === 'success'"
      [class.it-toast--error]="toast.type === 'error'"
      [class.it-toast--info]="toast.type === 'info'"
    >
      <div class="it-toast__content">
        @if (toast.title) {
          <div class="it-toast__title">{{ toast.title }}</div>
        }
        <div class="it-toast__msg">{{ toast.message }}</div>
      </div>

      <button class="it-toast__close" type="button" (click)="close(toast.id)" aria-label="Close">
        ×
      </button>
    </div>
  }
</div>
