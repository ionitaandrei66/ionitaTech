name: Deploy Angular

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      SSH_HOST: 82.198.227.251
      SSH_PORT: 65002
      DEPLOY_PATH: domains/ionitatech.com/public_html

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci
      - run: npm run build

      - name: Check dist folder
        run: ls -la dist/ionita-tech/browser

      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Pinned host key, so the deploy cannot be redirected to another server
          echo "[82.198.227.251]:65002 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIImZXnYQXE5OICrv/0XeU2t+PHOhXbLVtq+WTH+Lv/Hq" > ~/.ssh/known_hosts

      - name: Deploy with rsync over SSH
        run: |
          rsync -az --delete \
            -e "ssh -i ~/.ssh/deploy_key -p $SSH_PORT -o StrictHostKeyChecking=yes" \
            ./dist/ionita-tech/browser/ \
            "${{ secrets.SSH_USER }}@$SSH_HOST:$DEPLOY_PATH/"

      - name: Remove SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
